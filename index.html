      // GitHub Pages SPA redirect: restore path from ?p= query param
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the ?p= trick from 404.html
        var p = window.location.search.match(/[?&]p=([^&]+)/);
        if (p) {
          var path = decodeURIComponent(p[1].replace(/~and~/g, '&'));
          window.history.replaceState(null, null, '/SchoolBuddy' + path + (window.location.hash || ''));
        }
      })();
    </script>
