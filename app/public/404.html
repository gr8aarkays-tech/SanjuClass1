<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SanjuClass1</title>
    <script>
      // GitHub Pages SPA redirect: converts 404 path to ?p= query, then
      // index.html reads it back and replaces history state.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=/' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
